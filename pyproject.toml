[project]
name = "coding-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Manish"}
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "openai (>=3.14.1,<4.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.4.1,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.6.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.7.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-groq (>=1.1.3,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "console (>=0.9912,<0.9913)",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "fastembed (>=0.8.0,<0.9.0)",
    "langchain-google-genai (>=4.4.0,<5.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langgraph-checkpoint-sqlite (>=3.1.1,<4.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=8.1.0,<9.0.0) ; python_version >= \"3.12\" and python_version < \"3.15\"",
    "redisvl (>=0.27.2,<0.28.0) ; python_version >= \"3.12\" and python_version < \"3.15\""
]

[tool.poetry]
packages = [{include = "codepilot"}]

[tool.poetry.scripts]
codepilot = "codepilot.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
