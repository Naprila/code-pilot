llm:
  provider: groq              # groq | openai | anthropic
  model: openai/gpt-oss-120b        # gpt-4o

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

vector_store:
  provider: qdrant
  retrieval_mode: hybrid # dense | sparse | hybrid

qdrant:
  collection_name: codebase_sample

rag:
  mode: semantic # semantic | hybrid


memory:
  db_path: .codepilot/memory/memory.db
  summarize_at_tokens: 4000
  keep_last_messages: 20

# Vector Store
chromadb:
  persist_dir: .codepilot/chromadb/
  collection_name: codebase

# Lexical Store
elasticsearch:
  url: http://localhost:9200
  index_name: codebase