llm:
  provider: groq              # groq | openai | anthropic
  model: openai/gpt-oss-120b    # gpt-4o

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

vector_store:
  provider: qdrant

qdrant:
  collection_name: codebase

# Vector Store
chromadb:
  persist_dir: .chromadb/
  collection_name: codebase

# Lexical Store
elasticsearch:
  url: http://localhost:9200
  index_name: codebase